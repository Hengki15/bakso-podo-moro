<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Bakso Podo Moro</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>🌶️ Bakso Podo Moro — ADMIN</b><a href="index.html">← Pelanggan</a></header>
<main class="admin">
<div id="login" class="card login"><small>ADMIN PANEL</small><h1>Login Admin</h1><form onsubmit="loginAdmin(event)"><label>Username<input id="user" value="admin" required></label><label>Password<input id="pass" type="password" required></label><button class="btn full">Login</button></form></div>
<div id="dash" style="display:none"><div class="title"><div><small>DASHBOARD</small><h1>Kelola Bakso Podo Moro</h1></div><button onclick="logout()">Keluar</button></div>
<div class="stats"><div><b id="sm">0</b><span>Total Menu</span></div><div><b id="so">0</b><span>Total Pesanan</span></div><div><b id="sr">Rp0</b><span>Total Penjualan</span></div></div>
<div class="card"><div class="title"><h2>Kelola Menu</h2><button class="btn" onclick="openForm()">+ Tambah Menu</button></div><div id="table"></div></div>
<div class="card"><div class="title"><h2>Pesanan Masuk</h2><button onclick="clearOrders()">Hapus Semua</button></div><div id="orders"></div></div></div></main>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><button class="close" onclick="closeForm()">×</button><h2 id="mt">Tambah Menu</h2><form onsubmit="saveMenu(event)"><input type="hidden" id="eid"><label>Nama<input id="mn" required></label><label>Kategori<select id="mc"><option>Makanan</option><option>Snack</option><option>Minuman</option></select></label><label>Harga<input id="mp" type="number" required></label><label>Emoji<input id="me" required></label><label>Foto Menu<input id="photo" type="file" accept="image/*" onchange="previewPhoto(event)"><small>Pilih foto untuk mengganti foto menu.</small><img id="preview" class="photo-preview" style="display:none" alt="Preview foto"></label><label>Deskripsi<textarea id="md" required></textarea></label><button class="btn full">Simpan</button></form></div></div><script src="admin.js"></script></body></html>
